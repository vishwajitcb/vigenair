# ViGenAiR Docker Compose Configuration
# Deploy with Docker Compose using GCS + Vertex AI

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: vigenair-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # GCS Configuration
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_LOCATION=${GCS_LOCATION:-us-central1}
      - GEMINI_LOCATION=${GEMINI_LOCATION:-global}

      # Service account credentials (mounted as volume below)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/sa-key.json

      # Model Configuration
      - CONFIG_TEXT_MODEL=${CONFIG_TEXT_MODEL:-gemini-3-flash-preview}
      - CONFIG_VISION_MODEL=${CONFIG_VISION_MODEL:-gemini-3-flash-preview}
      - CONFIG_TRANSCRIPTION_MODEL_GEMINI=${CONFIG_TRANSCRIPTION_MODEL_GEMINI:-gemini-3-flash-preview}

      # Backend Configuration
      - CONFIG_BACKEND_VERSION=${CONFIG_BACKEND_VERSION:-v1}
      - CONFIG_MAX_VIDEO_CHUNK_SIZE=${CONFIG_MAX_VIDEO_CHUNK_SIZE:-500000000}
      - CONFIG_MAX_AUDIO_CHUNK_SIZE=${CONFIG_MAX_AUDIO_CHUNK_SIZE:-300}
      - CONFIG_MAX_CONCURRENCY=${CONFIG_MAX_CONCURRENCY:-15}
      - CONFIG_MAX_UPLOAD_CONCURRENCY=${CONFIG_MAX_UPLOAD_CONCURRENCY:-6}

      # CORS (adjust for production)
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

      # Authentication
      - AUTH_CREDENTIAL=${AUTH_CREDENTIAL}

      # MongoDB
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DB=${MONGODB_DB:-vigenair}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Service account key file
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./sa-key.json}:/app/sa-key.json:ro
      # Temp storage for video processing
      - vigenair_temp:/tmp/vigenair
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 6G

  # Frontend UI Service (New Plain HTML/JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigenair-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # MongoDB for job tracking and state persistence
  mongodb:
    image: mongo:7
    container_name: vigenair-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=vigenair
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queue (optional, for background tasks)
  redis:
    image: redis:7-alpine
    container_name: vigenair-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vigenair_temp:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: vigenair-network
