<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViGenAiR - Job Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16 gap-4">
                <a href="index.html" class="text-gray-500 hover:text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back
                </a>
                <div class="h-6 w-px bg-gray-300"></div>
                <h1 id="jobName" class="text-xl font-semibold text-gray-900">Loading...</h1>
                <div id="statusBadge" class="ml-auto"></div>
                <button id="logoutBtn" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-lg font-medium transition-colors">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Loading State -->
    <div id="loadingState" class="max-w-7xl mx-auto px-4 py-16 text-center">
        <div class="animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mx-auto mb-4"></div>
        <p class="text-gray-500">Loading job...</p>
    </div>

    <!-- Processing State -->
    <div id="processingState" class="hidden max-w-7xl mx-auto px-4 py-16">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 max-w-xl mx-auto text-center">
            <div class="animate-pulse w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2">Processing Video</h2>
            <p id="processingStage" class="text-gray-500 mb-4">Extracting audio...</p>
            <div class="h-2 bg-gray-200 rounded-full overflow-hidden mb-2">
                <div id="processingProgress" class="h-full bg-primary transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="processingPercent" class="text-sm text-gray-400">0%</p>
        </div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden max-w-7xl mx-auto px-4 py-16">
        <div class="bg-white rounded-xl shadow-sm border border-red-200 p-8 max-w-xl mx-auto text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2">Processing Failed</h2>
            <p id="errorMessage" class="text-gray-500 mb-4">An error occurred while processing the video.</p>
            <a href="index.html" class="text-primary hover:text-indigo-600 font-medium">Back to Dashboard</a>
        </div>
    </div>

    <!-- Main Content (shown when segments are ready) -->
    <main id="mainContent" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Video Player Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="aspect-video bg-black rounded-lg overflow-hidden mb-4">
                <video id="videoPlayer" class="w-full h-full" controls>
                    <source src="" type="video/mp4">
                </video>
            </div>

            <!-- Segments Strip -->
            <div class="mt-4">
                <h3 class="text-sm font-medium text-gray-700 mb-2">Segments</h3>
                <div id="segmentsStrip" class="flex gap-2 overflow-x-auto pb-2">
                </div>
            </div>
        </div>

        <!-- Generate Variants Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Generate Variants</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prompt</label>
                    <select id="promptSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                        <option value="default">Default - Balanced variants</option>
                        <option value="highlight">Highlight - Key moments</option>
                        <option value="engaging">Engaging - Hook viewers</option>
                        <option value="professional">Professional - Business focus</option>
                        <option value="social">Social - Platform optimized</option>
                        <option value="crop-only">Crop Only - No shortening</option>
                        <option value="custom">Custom prompt</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Target Duration: <span id="durationValue">30s</span></label>
                    <input type="range" id="durationSlider" min="10" max="120" value="30" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            <div id="customPromptContainer" class="hidden mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Custom Prompt</label>
                <textarea id="customPrompt" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Describe what kind of video variants you want..."></textarea>
            </div>

            <!-- Advanced Settings -->
            <div class="border-t border-gray-200 pt-4 mt-4 mb-4">
                <button type="button" id="advancedToggle" class="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-2">
                    <span>Advanced Settings</span>
                    <svg id="advancedIcon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div id="advancedSettings" class="hidden mt-4 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Number of Variants: <span id="numVariantsValue">5</span></label>
                            <input type="range" id="numVariantsSlider" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Business Objective</label>
                            <select id="businessObjective" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                                <option value="">None</option>
                                <option value="awareness">Awareness - Brand recognition</option>
                                <option value="consideration">Consideration - Product interest</option>
                                <option value="action">Action - Drive conversions</option>
                                <option value="shorts">Shorts - Quick format</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="shortenVideo" checked class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                            <span class="text-sm text-gray-700">Shorten Video</span>
                            <span class="text-xs text-gray-400">(uncheck for aspect-ratio-only cropping)</span>
                        </label>
                    </div>
                </div>
            </div>

            <button id="generateBtn" class="bg-primary hover:bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                Generate Variants
            </button>
        </div>

        <!-- Variants Section -->
        <div id="variantsSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Generated Variants</h2>
            <div id="variantTabs" class="flex gap-2 mb-4 border-b border-gray-200 pb-2 overflow-x-auto"></div>
            <div id="variantContent"></div>
        </div>

        <!-- Render Settings Section -->
        <div id="renderSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Render Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Formats</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="checkbox" name="format" value="16:9" checked class="w-4 h-4 text-primary">
                            <span>16:9</span>
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="checkbox" name="format" value="9:16" class="w-4 h-4 text-primary">
                            <span>9:16</span>
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="checkbox" name="format" value="1:1" class="w-4 h-4 text-primary">
                            <span>1:1</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Audio Mode</label>
                    <select id="audioMode" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none bg-white">
                        <option value="segment">Segment Audio</option>
                        <option value="music">Music Overlay</option>
                        <option value="continuous">Continuous Audio</option>
                    </select>
                </div>
            </div>
            <button id="renderBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                Start Render
            </button>
        </div>

        <!-- Rendered Videos Section -->
        <div id="rendersSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Rendered Videos</h2>
            <div id="rendersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module">
        import { checkAuth, logout } from './js/auth.js';

        // Check auth on page load
        checkAuth();

        // Add logout handler
        document.getElementById('logoutBtn').addEventListener('click', logout);
    </script>
    <script type="module" src="js/pages/job-detail.js"></script>
</body>
</html>
